services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks: [tp-net]

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: tp-kafka
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # PLAINTEXT_HOST: reachable from your machine; INTERNAL: reachable from other containers
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:9092,INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT_HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks: [tp-net]

  mongo:
    image: mongo:7
    container_name: tp-mongo
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    networks: [tp-net]

  spark-master:
    image: bitnami/spark:3.5
    container_name: tp-spark-master
    environment:
      SPARK_MODE: master
    ports: ["8080:8080", "7077:7077"]
    volumes: [".:/opt/tickerpulse"]
    networks: [tp-net]

  spark-worker:
    image: bitnami/spark:3.5
    depends_on: [spark-master]
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
    volumes: [".:/opt/tickerpulse"]
    networks: [tp-net]

networks:
  tp-net:
    driver: bridge

volumes:
  mongo-data:
